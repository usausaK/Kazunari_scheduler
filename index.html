<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のスケジューリング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2E9;
    --paper-deep:#ECE6D4;
    --rule:#D9D0B8;
    --rule-red:#C67A6E;
    --ink:#26231F;
    --ink-soft:#8A8072;
    --ink-faint:#B7AF9E;
    --blue:#2E4C79;
    --blue-soft:#DEE6F1;
    --blue-line:#B9C8DE;
    --amber:#B4802C;
    --amber-soft:#F1E1BE;
    --amber-line:#DFC38A;
    --green:#4B6B4E;
    --green-soft:#E1E9DD;
    --red:#A3483A;
    --red-soft:#F1DAD4;
    --white:#FFFFFF;
    --shadow:0 1px 2px rgba(38,35,31,.08),0 6px 16px rgba(38,35,31,.07);
    --radius:10px;
    --pri0-soft:#F6DDD3; --pri0-line:#D98A63; --pri0-text:#93401F;
    --pri1-soft:#DCE4F1; --pri1-line:#5F86B8; --pri1-text:#274469;
    --pri2-soft:#D9EDEB; --pri2-line:#4FA79B; --pri2-text:#215951;
    --pri3-soft:#E9DFF0; --pri3-line:#9B72BC; --pri3-text:#5C3D79;
    --pri4-soft:#F3DCE3; --pri4-line:#C46E8A; --pri4-text:#82304C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(720px 420px at 100% -8%, rgba(196,87,59,.07), transparent 60%),
      radial-gradient(640px 380px at -6% 12%, rgba(79,167,155,.07), transparent 55%),
      var(--paper);
    background-image:
      radial-gradient(720px 420px at 100% -8%, rgba(196,87,59,.07), transparent 60%),
      radial-gradient(640px 380px at -6% 12%, rgba(79,167,155,.07), transparent 55%),
      linear-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size: auto, auto, 100% 32px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Klee One', 'Zen Kaku Gothic New', sans-serif; margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .container{ max-width:860px; margin:0 auto; padding:20px 16px 64px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin-bottom:18px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; border-radius:50%; background:var(--blue);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{ width:18px; height:18px; stroke:var(--white); }
  .brand-title{ font-size:15px; color:var(--ink-soft); letter-spacing:.02em; }

  .sync-status{ font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
  .sync-status.ok .sync-dot{ background:var(--green); }
  .sync-status.busy .sync-dot{ background:var(--amber); animation:pulse 1s infinite; }
  .sync-status.off .sync-dot{ background:var(--red); }
  @keyframes pulse{ 50%{ opacity:.35; } }

  .day-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .day-nav .navbtn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--rule);
    background:var(--white); display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .day-nav .navbtn svg{ width:16px; height:16px; stroke:var(--ink); }
  .day-title{ flex:1; }
  .day-title h1{ font-size:26px; font-weight:600; line-height:1.15; }
  .day-title .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .day-title input[type=date]{
    border:none; background:transparent; font:inherit; color:var(--ink);
    font-size:13px; padding:0; margin-top:2px; cursor:pointer;
  }

  .card{
    background:var(--white); border:1px solid var(--rule); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 18px 20px; margin-bottom:18px;
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .card-head h2{ font-size:16px; font-weight:600; }
  .card-head .hint{ font-size:11.5px; color:var(--ink-faint); }

  /* task table */
  .task-table{ display:flex; flex-direction:column; gap:8px; }
  .task-head-row{
    display:grid; grid-template-columns:32px 1fr 128px 78px 30px;
    gap:8px; padding:0 4px; font-size:11.5px; color:var(--ink-faint);
  }
  .task-row{
    display:grid; grid-template-columns:32px 1fr 128px 78px 30px;
    gap:8px; align-items:center; background:var(--paper); border:1px solid var(--rule);
    border-radius:8px; padding:7px 8px;
    transition:box-shadow .15s ease, opacity .15s ease;
  }
  .task-row.done{ opacity:.55; }
  .task-row input[type=text]{
    border:none; background:transparent; font-size:14px; color:var(--ink); width:100%; padding:4px 2px;
  }
  .task-row input[type=date]{
    border:none; background:transparent; font-size:12.5px; color:var(--ink-soft); width:100%;
  }
  .task-drag-handle{
    width:28px; height:36px; border:none; border-radius:6px; background:transparent;
    color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    cursor:grab; touch-action:none;
  }
  .task-drag-handle:hover{ background:var(--paper-deep); color:var(--blue); }
  .task-drag-handle:active{ cursor:grabbing; }
  .task-drag-handle svg{ width:16px; height:16px; }
  .priority-number{
    display:inline-flex; min-width:28px; height:28px; align-items:center; justify-content:center;
    border-radius:50%; background:var(--white); border:1px solid var(--rule);
    color:var(--blue); font-size:13px; font-weight:700;
  }
  .f-priority{ display:flex; justify-content:center; }
  .task-row.task-list-placeholder{ visibility:hidden; }
  .task-drag-ghost{
    position:fixed; z-index:1000; margin:0; pointer-events:none;
    opacity:.94; box-shadow:0 12px 28px rgba(38,35,31,.24);
    will-change:transform;
  }
  .task-row input:focus{ outline:2px solid var(--blue-line); outline-offset:1px; border-radius:4px; }
  .icon-btn{
    border:none; background:transparent; width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .icon-btn:hover{ background:var(--red-soft); color:var(--red); }
  .icon-btn svg{ width:15px; height:15px; stroke:currentColor; }
  .add-row-btn{
    margin-top:4px; align-self:flex-start; display:flex; align-items:center; gap:6px;
    background:none; border:1px dashed var(--rule); color:var(--blue); font-size:13px;
    padding:7px 14px; border-radius:8px;
  }
  .add-row-btn:hover{ background:var(--blue-soft); }
  .add-row-btn svg{ width:14px; height:14px; stroke:currentColor; }
  .empty-hint{ font-size:13px; color:var(--ink-faint); padding:6px 4px; }

  textarea.meetings-input{
    width:100%; min-height:88px; border:1px solid var(--rule); border-radius:8px;
    background:var(--paper); padding:10px 12px; font-size:13.5px; color:var(--ink);
    resize:vertical; line-height:1.6;
  }
  textarea.meetings-input:focus{ outline:2px solid var(--blue-line); outline-offset:1px; }
  .meetings-preview{ margin-top:10px; font-size:12px; color:var(--ink-soft); }
  .meetings-preview b{ color:var(--blue); font-weight:700; }

  .time-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .time-field label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .time-pair{ display:flex; align-items:center; gap:8px; }
  .time-pair input[type=time]{
    flex:1; border:1px solid var(--rule); border-radius:8px; padding:8px 9px;
    background:var(--paper); font-size:14px; color:var(--ink);
  }
  .time-pair span{ color:var(--ink-faint); font-size:13px; }

  .btn{
    border:none; border-radius:9px; padding:11px 20px; font-size:14.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow);
  }
  .btn-primary{ background:var(--blue); color:var(--white); }
  .btn-primary:hover{ background:#25406A; }
  .btn-ghost{ background:var(--white); color:var(--ink); border:1px solid var(--rule); box-shadow:none; }
  .btn-ghost:hover{ background:var(--paper-deep); }
  .btn svg{ width:15px; height:15px; stroke:currentColor; }
  .btn-block{ width:100%; justify-content:center; font-size:15.5px; padding:14px; margin-top:4px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .page{ animation:fade .25s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .page{ animation:none; } }

  /* schedule page */
  .sched-date{ font-size:30px; font-weight:600; line-height:1.15; }
  .sched-sub{ font-size:13px; color:var(--ink-soft); margin-top:3px; }
  .sched-topline{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .sched-actions{ display:flex; gap:8px; }
  .sched-warn{
    font-size:12px; color:var(--red); background:var(--red-soft); border-radius:7px;
    padding:8px 12px; margin-bottom:12px;
  }
  .sched-hint{ font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }

  .timeline-wrap{
    background:var(--white); border:1px solid var(--rule); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 14px 24px 0; overflow:hidden; position:relative;
  }
  .timeline{ position:relative; margin-left:64px; border-left:2px solid var(--rule-red); }
  .hour-mark{
    position:absolute; left:0; width:100%; border-top:1px solid var(--rule);
  }
  .hour-mark.half{ border-top:1px dashed var(--rule); }
  .hour-label{
    position:absolute; left:-58px; top:-8px; width:48px; text-align:right;
    font-size:12px; color:var(--ink-soft); font-weight:500;
  }
  .now-line{
    position:absolute; left:-2px; width:calc(100% + 2px); border-top:2px solid var(--red); z-index:5;
  }
  .now-line::before{
    content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px;
    border-radius:50%; background:var(--red);
  }
  .now-line-label{
    position:absolute; left:8px; top:-9px; font-size:10px; font-weight:700; color:var(--white);
    background:var(--red); padding:1px 7px; border-radius:20px; letter-spacing:.02em;
  }

  .block{
    position:absolute; left:10px; right:10px; border-radius:8px; overflow:hidden;
    box-shadow:0 1px 3px rgba(38,35,31,.12);
  }
  .block-inner{ padding:6px 10px; height:100%; display:flex; flex-direction:column; gap:2px; }
  .block-fixed{ background:var(--amber-soft); border:1px solid var(--amber-line); }
  .block-fixed.lunch{
    background:var(--white);
    border:2px solid #7F9F82;
    box-shadow:0 1px 3px rgba(38,35,31,.12), inset 0 0 0 3px var(--white), inset 0 0 0 4px #B7CDB8;
  }
  .block-fixed.lunch::after{
    content:'';
    position:absolute;
    inset:5px;
    border:1px solid rgba(75,107,78,.28);
    border-radius:4px;
    pointer-events:none;
    z-index:1;
  }
  .block-fixed.lunch .block-inner{
    position:relative;
    z-index:2;
  }
  .block-fixed.lunch .grip,
  .block-fixed.lunch .block-tag,
  .block-fixed.lunch .resize-handle{
    z-index:2;
  }
  .block-fixed.lunch .block-tag{
    background:var(--white);
    color:var(--ink);
    border-color:#9DB79F;
  }
  .block-task{ background:var(--pri1-soft); border:1px solid var(--pri1-line); }
  .block-task .block-inner{ padding-left:14px; }
  .block-task::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--pri1-line); }
  .block-task.pri-0{ background:var(--pri0-soft); border-color:var(--pri0-line); }
  .block-task.pri-0::before{ background:var(--pri0-line); }
  .block-task.pri-0 .block-title{ color:var(--pri0-text); }
  .block-task.pri-1{ background:var(--pri1-soft); border-color:var(--pri1-line); }
  .block-task.pri-1::before{ background:var(--pri1-line); }
  .block-task.pri-1 .block-title{ color:var(--pri1-text); }
  .block-task.pri-2{ background:var(--pri2-soft); border-color:var(--pri2-line); }
  .block-task.pri-2::before{ background:var(--pri2-line); }
  .block-task.pri-2 .block-title{ color:var(--pri2-text); }
  .block-task.pri-3{ background:var(--pri3-soft); border-color:var(--pri3-line); }
  .block-task.pri-3::before{ background:var(--pri3-line); }
  .block-task.pri-3 .block-title{ color:var(--pri3-text); }
  .block-task.pri-4{ background:var(--pri4-soft); border-color:var(--pri4-line); }
  .block-task.pri-4::before{ background:var(--pri4-line); }
  .block-task.pri-4 .block-title{ color:var(--pri4-text); }
  .block-task.done{ background:var(--paper-deep); border:1px solid var(--rule); }
  .block-task.done::before{ background:var(--ink-faint); }
  .block-task.done .block-title{ color:var(--ink-soft) !important; text-decoration:line-through; }
  .block-title{ font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.25; }
  .block-fixed .block-title{ color:#7A5A1E; }
  .block-fixed.lunch .block-title{ color:var(--ink); }
  .block-time{ font-size:10.5px; color:var(--ink-soft); }
  .block-fixed.lunch .block-time{ color:var(--ink); }

  /* 30分以下の短いブロックは、操作部品のための上余白を詰めて内容と時間を表示する */
  .block.short-block .block-inner{
    padding-top:3px !important;
    padding-bottom:3px !important;
    gap:0;
    justify-content:center;
  }
  .block-task.short-block .block-inner{
    padding-left:30px;
    padding-right:30px;
  }
  .block-fixed.lunch.short-block .block-inner{
    padding-left:30px;
    padding-right:54px;
  }
  .block.short-block .block-title{
    font-size:11.5px;
    line-height:1.08;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .block.short-block .block-time{
    font-size:9.5px;
    line-height:1.05;
    white-space:nowrap;
  }
  .block.short-block .block-tag{
    top:3px;
    right:4px;
    font-size:8.5px;
    padding:0 5px;
  }

  /* 20分以下は1行配置にして、さらに狭い高さでも読めるようにする */
  .block.tiny-block .block-inner{
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:7px;
    padding-top:2px !important;
    padding-bottom:2px !important;
  }
  .block.tiny-block .block-title{
    flex:1;
    min-width:0;
  }
  .block.tiny-block .block-time{
    flex-shrink:0;
  }
  .block-fixed.lunch.tiny-block .block-tag{ display:none; }

  .block-tag{
    position:absolute; top:5px; right:6px; font-size:9.5px; padding:1px 6px; border-radius:20px;
    background:var(--white); color:var(--blue); font-weight:700; border:1px solid var(--blue-line);
  }
  .block-task .grip, .block-fixed.lunch .grip{
    position:absolute; top:4px; left:8px; width:16px; height:16px; cursor:grab;
    color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  .block-task .grip svg, .block-fixed.lunch .grip svg{ width:12px; height:12px; }
  .block-task .done-toggle{
    position:absolute; top:4px; right:4px; width:17px; height:17px; border-radius:5px;
    border:1.5px solid var(--pri1-line); background:var(--white); display:flex; align-items:center; justify-content:center;
  }
  .block-task.pri-0 .done-toggle{ border-color:var(--pri0-line); }
  .block-task.pri-2 .done-toggle{ border-color:var(--pri2-line); }
  .block-task.pri-3 .done-toggle{ border-color:var(--pri3-line); }
  .block-task.pri-4 .done-toggle{ border-color:var(--pri4-line); }
  .block-task.done .done-toggle{ background:var(--green); border-color:var(--green); }
  .block-task .done-toggle svg{ width:11px; height:11px; stroke:var(--white); opacity:0; }
  .block-task.done .done-toggle svg{ opacity:1; }
  .resize-handle{
    position:absolute; left:0; right:0; bottom:0; height:12px; cursor:ns-resize;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px;
    touch-action:none;
  }
  .resize-handle::after{ content:''; width:22px; height:3px; border-radius:2px; background:var(--blue-line); }
  .block.dragging{ opacity:.55; z-index:20; }
  .block.resizing{ z-index:20; }

  .overflow-box{
    margin-top:14px; padding:12px 14px; background:var(--red-soft); border-radius:8px; font-size:13px; color:var(--red);
  }
  .overflow-box b{ display:block; margin-bottom:4px; font-size:12.5px; }

  .progress-strip{ display:flex; align-items:center; gap:10px; margin:10px 0 16px; }
  .progress-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
  .progress-track{ flex:1; height:8px; border-radius:20px; background:var(--paper-deep); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:20px; background:linear-gradient(90deg,var(--pri0-line),var(--pri3-line)); transition:width .3s ease; }
  .celebrate-box{
    margin-top:14px; padding:12px 14px; border-radius:8px; font-size:13.5px; font-weight:700;
    background:var(--pri2-soft); color:var(--pri2-text); display:flex; align-items:center; gap:8px;
  }
  .celebrate-box svg{ width:16px; height:16px; stroke:currentColor; flex-shrink:0; }

  [data-label]{ position:relative; }
  @media (max-width:560px){
    .time-grid{ grid-template-columns:1fr; }
    .task-head-row{ display:none; }
    .task-row{
      grid-template-columns:30px 1fr 30px; grid-template-rows:auto auto auto; row-gap:6px;
    }
    .task-row .task-drag-handle{ grid-column:1/2; grid-row:1/4; align-self:stretch; height:auto; }
    .task-row .f-name{ grid-column:2/3; grid-row:1; }
    .task-row .f-del{ grid-column:3/4; grid-row:1; }
    .task-row .f-deadline, .task-row .f-priority{
      grid-column:2/4; display:flex; align-items:center; justify-content:flex-start; gap:6px;
    }
    .task-row .f-deadline{ grid-row:2; }
    .task-row .f-priority{ grid-row:3; }
    .task-row [data-label]::before{
      content:attr(data-label); font-size:10.5px; color:var(--ink-faint); white-space:nowrap;
    }
    .day-title h1{ font-size:22px; }
  }

  .no-print{}

  /* A4 print layout — PC / iPhone 共通 */
  @page{
    size:A4 portrait;
    margin:8mm;
  }

  @media print{
    * {
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
      box-sizing:border-box !important;
    }

    html, body{
      width:100% !important;
      min-width:0 !important;
      margin:0 !important;
      padding:0 !important;
      overflow:visible !important;
      -webkit-text-size-adjust:100% !important;
    }

    body{ background:var(--white) !important; }
    .no-print{ display:none !important; }

    /* 210mm(A4) - 左右余白16mm = 194mm。少し余裕を持たせて190mmに固定 */
    .container{
      width:100% !important;
      max-width:190mm !important;
      margin:0 auto !important;
      padding:0 !important;
    }

    .page{
      width:100% !important;
      max-width:100% !important;
      margin:0 !important;
      break-inside:avoid-page;
      page-break-inside:avoid;
    }

    /* 印刷時は上部の余白を少し圧縮して1ページに収まりやすくする */
    .sched-topline{ margin-bottom:3px !important; }
    .sched-date{ font-size:24px !important; line-height:1.1 !important; }
    .sched-sub{ margin-top:1px !important; font-size:11px !important; }
    .progress-strip{ margin:5px 0 8px !important; }

    .timeline-wrap{
      width:100% !important;
      max-width:100% !important;
      box-shadow:none !important;
      border:none !important;
      padding:10px 8px 14px 0 !important;
      overflow:hidden !important;
    }
    .timeline{ margin-left:52px !important; }
    .hour-label{
      left:-47px !important;
      width:39px !important;
      font-size:10px !important;
    }
    .block{ left:8px !important; right:8px !important; }
    .block-title{ font-size:11.5px !important; }
    .block-time{ font-size:9.5px !important; }
    .block-tag{ font-size:8.5px !important; }

    .celebrate-box, .overflow-box{
      margin-top:7px !important;
      padding:8px 10px !important;
    }
    .card{ box-shadow:none !important; }
  }

  /* iPhone/iPad の WebKit 印刷はPCより大きめにレイアウトされることがあるため安全側に縮小 */
  @supports (-webkit-touch-callout:none){
    @media print{
      #app{
        zoom:.92;
      }
    }
  }
</style>
</head>
<body>
<div id="app" class="container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   Firebase setup
   kids-schedule-app と同じ Firebase プロジェクトを使う場合は、
   そのプロジェクトの firebaseConfig をそのままここに貼り付けてください。
   別プロジェクトにしたい場合は、Firebase コンソールで新規プロジェクト
   → Firestore Database を有効化 → ウェブアプリを追加、して
   表示される config をここに貼り付けてください。
   コレクション名は "dailyPlanner" を使うので、kids-schedule-app の
   データ (別コレクション) とは衝突しません。
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyALmeF9aLshtmHCW11UPZhtZ4pgFoWfNdQ",
  authDomain: "kazunari-scheduler.firebaseapp.com",
  projectId: "kazunari-scheduler",
  storageBucket: "kazunari-scheduler.firebasestorage.app",
  messagingSenderId: "427034348968",
  appId: "1:427034348968:web:c4b11986b139f7c326619d",
};

let db = null;
let cloudEnabled = false;
try {
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
  cloudEnabled = firebaseConfig.apiKey !== "YOUR_API_KEY";
} catch (e) {
  console.warn("Firebase init failed, running in local-only mode.", e);
  cloudEnabled = false;
}

/* =========================================================
   Utilities
   ========================================================= */
const PX_PER_MIN = 1.5;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const pad2 = n => String(n).padStart(2, '0');
const toMin = (hhmm) => { if(!hhmm) return null; const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
const toHHMM = (min) => { min = Math.max(0, Math.round(min)); return pad2(Math.floor(min/60)%24) + ':' + pad2(min%60); };
const fmtDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fmtDateLabel = (dateStr) => {
  const [y,m,d] = dateStr.split('-').map(Number);
  const wd = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
  return `${m}月${d}日(${wd})`;
};
const clamp5 = (min) => Math.max(5, Math.round(min/5)*5);
const round5 = (min) => Math.round(min/5)*5;

const TIME_RANGE_RE = /(\d{1,2})(?:[:：時](\d{1,2})?分?)?\s*[-〜~～ー]\s*(\d{1,2})(?:[:：時](\d{1,2})?分?)?/;

function parseMeetingsText(text) {
  const lines = (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const meetings = [];
  const unrecognized = [];
  for (const line of lines) {
    const m = line.match(TIME_RANGE_RE);
    if (!m) { unrecognized.push(line); continue; }
    const sH = +m[1], sM = +(m[2] || 0), eH = +m[3], eM = +(m[4] || 0);
    const start = sH*60+sM, end = eH*60+eM;
    if (end <= start) { unrecognized.push(line); continue; }
    let title = (line.slice(0, m.index) + line.slice(m.index + m[0].length)).trim();
    title = title.replace(/^[\s,、:：\-ー]+|[\s,、:：\-ー]+$/g, '');
    if (!title) title = '会議';
    meetings.push({ id: 'mtg-' + start, start, end, title });
  }
  meetings.sort((a,b) => a.start - b.start);
  return { meetings, unrecognized };
}

function defaultDateState(dateStr) {
  return {
    date: dateStr,
    meetingsText: '',
    workStart: '09:00',
    workEnd: '18:00',
    lunchStart: '12:00',
    lunchEnd: '13:00',
    scheduleTasks: [],   // その日にスケジューリングした時点のタスクのスナップショット(並び順=配置順)
    generated: false,    // その日がスケジューリング済みかどうか
  };
}

// state.masterTasks: 日付に関係なく持ち越される、やることリスト本体
// state.date 以下の各フィールド: その日固有の会議・業務時間・生成済みスケジュール
let state = { masterTasks: [], page: 'input', ...defaultDateState(fmtDate(new Date())) };

function resetDateFields(dateStr) { Object.assign(state, defaultDateState(dateStr)); }

function renumberMasterTasks() {
  let changed = false;
  state.masterTasks.forEach((task, index) => {
    const priority = index + 1;
    if (task.priority !== priority) changed = true;
    task.priority = priority;
  });
  return changed;
}

let unsubscribeMaster = null;
let unsubscribeDate = null;
let saveTimerDate = null;
let saveTimerMaster = null;
let syncState = cloudEnabled ? 'ok' : 'off';

/* =========================================================
   Firestore sync
   ========================================================= */
function attachMasterListener() {
  if (!cloudEnabled) return;
  const ref = doc(db, 'dailyPlannerTasks', 'main');
  unsubscribeMaster = onSnapshot(ref, (snap) => {
    if (snap.metadata.hasPendingWrites) return;
    state.masterTasks = snap.exists() ? (snap.data().tasks || []) : [];
    const prioritiesChanged = renumberMasterTasks();
    setSync('ok');
    render();
    if (prioritiesChanged) scheduleSaveMaster();
  }, (err) => { console.warn('master onSnapshot error', err); setSync('off'); });
}

function attachDateListener(dateStr) {
  if (!cloudEnabled) return;
  if (unsubscribeDate) { unsubscribeDate(); unsubscribeDate = null; }
  const ref = doc(db, 'dailyPlanner', dateStr);
  unsubscribeDate = onSnapshot(ref, (snap) => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists()) {
      Object.assign(state, defaultDateState(dateStr), snap.data(), { date: dateStr });
    } else {
      resetDateFields(dateStr);
    }
    setSync('ok');
    render();
  }, (err) => { console.warn('date onSnapshot error', err); setSync('off'); });
}

function scheduleSaveDate() {
  if (!cloudEnabled) return;
  setSync('busy');
  clearTimeout(saveTimerDate);
  saveTimerDate = setTimeout(async () => {
    try {
      const { date, meetingsText, workStart, workEnd, lunchStart, lunchEnd, scheduleTasks, generated } = state;
      await setDoc(doc(db, 'dailyPlanner', state.date), { date, meetingsText, workStart, workEnd, lunchStart, lunchEnd, scheduleTasks, generated }, { merge: false });
      setSync('ok');
    } catch (e) { console.warn('save (date) failed', e); setSync('off'); }
  }, 500);
}

function scheduleSaveMaster() {
  if (!cloudEnabled) return;
  setSync('busy');
  clearTimeout(saveTimerMaster);
  saveTimerMaster = setTimeout(async () => {
    try {
      await setDoc(doc(db, 'dailyPlannerTasks', 'main'), { tasks: state.masterTasks }, { merge: false });
      setSync('ok');
    } catch (e) { console.warn('save (master) failed', e); setSync('off'); }
  }, 500);
}

function setSync(s) { syncState = s; const el = document.getElementById('syncStatus'); if (el) paintSyncStatus(el); }
function paintSyncStatus(el) {
  el.className = 'sync-status ' + syncState;
  el.querySelector('span').textContent =
    syncState === 'ok' ? (cloudEnabled ? '同期済み' : 'ローカルのみ') :
    syncState === 'busy' ? '保存中…' : '未接続';
}

/* =========================================================
   Scheduling engine
   ========================================================= */
function buildSchedule() {
  const workStart = toMin(state.workStart);
  const workEnd = toMin(state.workEnd);
  const result = { blocks: [], overflow: [], unrecognized: [], meetingsCount: 0, valid: true };
  if (workStart == null || workEnd == null || workEnd <= workStart) {
    result.valid = false;
    return result;
  }

  const { meetings, unrecognized } = parseMeetingsText(state.meetingsText);
  result.unrecognized = unrecognized;
  result.meetingsCount = meetings.length;

  const fixed = meetings.map(m => ({ ...m, type: 'meeting' }));
  const lunchStart = toMin(state.lunchStart), lunchEnd = toMin(state.lunchEnd);
  if (lunchStart != null && lunchEnd != null && lunchEnd > lunchStart) {
    fixed.push({ id: 'lunch', start: lunchStart, end: lunchEnd, title: 'ランチタイム', type: 'lunch' });
  }
  // clamp to work hours & drop invalid
  const clamped = fixed
    .map(f => ({ ...f, start: Math.max(f.start, workStart), end: Math.min(f.end, workEnd) }))
    .filter(f => f.end > f.start)
    .sort((a,b) => a.start - b.start);
  // merge overlaps by simply keeping chronological order (start-clip if overlapping previous)
  const fixedBlocks = [];
  let lastEnd = workStart;
  for (const f of clamped) {
    const start = Math.max(f.start, lastEnd);
    if (start >= f.end) continue;
    fixedBlocks.push({ ...f, start, end: f.end });
    lastEnd = f.end;
  }

  // free segments
  const segments = [];
  let cursor = workStart;
  for (const f of fixedBlocks) {
    if (f.start > cursor) segments.push({ start: cursor, end: f.start });
    cursor = Math.max(cursor, f.end);
  }
  if (cursor < workEnd) segments.push({ start: cursor, end: workEnd });
  const totalFree = segments.reduce((s, seg) => s + (seg.end - seg.start), 0);

  // その日にスケジューリングした時点のタスク(並び順=配置順)。完了済みは除外。
  const pending = (state.scheduleTasks || []).filter(t => !t.done);

  const manualTotal = pending.reduce((s,t) => s + (t.manualDuration || 0), 0);
  const autoTasks = pending.filter(t => !t.manualDuration);
  const remainingForAuto = totalFree - manualTotal;
  const autoDuration = autoTasks.length > 0 ? Math.max(0, clamp5(remainingForAuto / autoTasks.length)) : 0;

  const segs = segments.map(s => ({ ...s }));
  let segIdx = 0;
  let segCursor = segs.length ? segs[0].start : null;
  const taskBlocks = [];

  for (const t of pending) {
    const plannedDuration = t.manualDuration || autoDuration;
    let remaining = plannedDuration;
    if (remaining <= 0) { result.overflow.push(t); continue; }
    const firstPartIndex = taskBlocks.length;
    let placedAny = false;
    while (remaining > 0 && segIdx < segs.length) {
      if (segCursor >= segs[segIdx].end) { segIdx++; segCursor = segs[segIdx] ? segs[segIdx].start : null; continue; }
      const availableInSeg = segs[segIdx].end - segCursor;
      const take = Math.min(availableInSeg, remaining);
      taskBlocks.push({ id: 'blk-' + t.id + '-' + segIdx, type: 'task', taskId: t.id, title: t.name || '(無題タスク)', start: segCursor, end: segCursor + take, done: !!t.done, priority: t.priority ?? 1 });
      segCursor += take;
      remaining -= take;
      placedAny = true;
      if (segCursor >= segs[segIdx].end) { segIdx++; segCursor = segs[segIdx] ? segs[segIdx].start : null; }
    }

    const taskParts = taskBlocks.slice(firstPartIndex);
    taskParts.forEach((part, index) => {
      part.partIndex = index + 1;
      part.partCount = taskParts.length;
      part.totalDuration = plannedDuration;
    });

    if (remaining > 0) result.overflow.push(t);
    else if (!placedAny) result.overflow.push(t);
  }

  const allBlocks = [
    ...fixedBlocks.map(f => ({ id: f.id, type: f.type, title: f.title, start: f.start, end: f.end, fixed: true })),
    ...taskBlocks,
  ].sort((a,b) => a.start - b.start);

  result.blocks = allBlocks;
  result.workStart = workStart;
  result.workEnd = workEnd;
  return result;
}

/* =========================================================
   Icons
   ========================================================= */
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  printer: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M6 14h12v7H6z"/></svg>',
  chevLeft: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevRight: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  arrowLeft: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
};

/* =========================================================
   Rendering
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = topbarHTML() + (state.page === 'input' ? inputPageHTML() : schedulePageHTML());
  const syncEl = document.getElementById('syncStatus');
  if (syncEl) paintSyncStatus(syncEl);
  if (state.page === 'schedule') positionBlocks();
}

function topbarHTML() {
  return `
  <div class="topbar no-print">
    <div class="brand">
      <div class="mark">${ICON.calendar}</div>
      <div class="brand-title">今日のスケジューリング</div>
    </div>
    <div class="sync-status ${syncState}" id="syncStatus"><span class="sync-dot"></span><span>—</span></div>
  </div>`;
}

function inputPageHTML() {
  const tasks = state.masterTasks;
  const scheduleButtons = state.generated
    ? `<div class="no-print" style="display:flex;gap:10px;margin-top:4px">
         <button class="btn btn-primary" style="flex:1;justify-content:center" data-action="view-schedule">この日の予定を見る ${ICON.chevRight}</button>
         <button class="btn btn-ghost" data-action="run-schedule">スケジューリングし直す</button>
       </div>`
    : `<button class="btn btn-primary btn-block" data-action="run-schedule">スケジューリングする ${ICON.chevRight}</button>`;
  return `
  <div class="page">
    <div class="day-nav no-print">
      <button class="navbtn" data-action="prev-day" aria-label="前の日">${ICON.chevLeft}</button>
      <div class="day-title">
        <h1>${fmtDateLabel(state.date)}</h1>
        <input type="date" value="${state.date}" data-action="set-date">
      </div>
      <button class="navbtn" data-action="next-day" aria-label="次の日">${ICON.chevRight}</button>
    </div>

    <div class="card">
      <div class="card-head"><h2>やることリスト</h2><span class="hint">日をまたいで持ち越されます</span></div>
      <div class="task-table">
        <div class="task-head-row"><span></span><span>タスク</span><span>期限</span><span>優先度</span><span></span></div>
        ${tasks.length ? tasks.map(taskRowHTML).join('') : '<div class="empty-hint">まだタスクがありません。「追加」から始めましょう。</div>'}
      </div>
      <button class="add-row-btn" data-action="add-task">${ICON.plus}追加</button>
    </div>

    <div class="card">
      <div class="card-head"><h2>今日の会議</h2><span class="hint">1行に1件、時刻付きで入力</span></div>
      <textarea class="meetings-input" placeholder="例）&#10;10:00-10:30 朝会&#10;14:00〜15:00 A社商談" data-field="meetingsText">${escapeHTML(state.meetingsText)}</textarea>
      ${meetingsPreviewHTML()}
    </div>

    <div class="card">
      <div class="card-head"><h2>今日の業務時間</h2></div>
      <div class="time-grid">
        <div class="time-field">
          <label>業務時間</label>
          <div class="time-pair">
            <input type="time" value="${state.workStart}" data-time-field="workStart">
            <span>〜</span>
            <input type="time" value="${state.workEnd}" data-time-field="workEnd">
          </div>
        </div>
        <div class="time-field">
          <label>ランチタイム</label>
          <div class="time-pair">
            <input type="time" value="${state.lunchStart}" data-time-field="lunchStart">
            <span>〜</span>
            <input type="time" value="${state.lunchEnd}" data-time-field="lunchEnd">
          </div>
        </div>
      </div>
    </div>

    ${scheduleButtons}
  </div>`;
}

function taskRowHTML(t) {
  return `
  <div class="task-row ${t.done ? 'done' : ''}" data-task-id="${t.id}">
    <button class="task-drag-handle" type="button" aria-label="このタスクを並べ替える">${ICON.grip}</button>
    <div class="f-name" data-label="タスク"><input type="text" placeholder="タスク名" value="${escapeAttr(t.name)}" data-task-field="name"></div>
    <div class="f-deadline" data-label="期限"><input type="date" value="${t.deadline || ''}" data-task-field="deadline"></div>
    <div class="f-priority" data-label="優先度"><span class="priority-number">${t.priority ?? 1}</span></div>
    <div class="f-del"><button class="icon-btn" data-action="delete-task" aria-label="削除">${ICON.trash}</button></div>
  </div>`;
}

function meetingsPreviewHTML() {
  const { meetings, unrecognized } = parseMeetingsText(state.meetingsText);
  if (!state.meetingsText.trim()) return '';
  let html = `<div class="meetings-preview">`;
  html += `<b>${meetings.length}件</b> の会議を認識しました`;
  if (unrecognized.length) {
    html += `<br>認識できなかった行: ${unrecognized.map(escapeHTML).join(' / ')}`;
  }
  html += `</div>`;
  return html;
}

function schedulePageHTML() {
  const now = new Date();
  const isToday = state.date === fmtDate(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  if (!state.generated) {
    return `
    <div class="page">
      <div class="sched-topline">
        <h1 class="sched-date">${fmtDateLabel(state.date)}</h1>
        <button class="btn btn-ghost no-print" data-action="go-input">${ICON.arrowLeft}編集に戻る</button>
      </div>
      <div class="sched-warn" style="background:var(--blue-soft);color:var(--blue)">この日はまだスケジューリングされていません。編集画面の「スケジューリングする」から作成してください。</div>
    </div>`;
  }

  const sched = buildSchedule();

  if (!sched.valid) {
    return `
    <div class="page">
      <div class="sched-topline">
        <h1 class="sched-date">${fmtDateLabel(state.date)}</h1>
        <button class="btn btn-ghost no-print" data-action="go-input">${ICON.arrowLeft}編集に戻る</button>
      </div>
      <div class="sched-warn">業務時間の設定を確認してください(終了時刻は開始時刻より後にしてください)。</div>
    </div>`;
  }

  const totalMin = sched.workEnd - sched.workStart;
  const heightPx = totalMin * PX_PER_MIN;

  let marks = '';
  for (let m = sched.workStart; m <= sched.workEnd; m += 30) {
    const top = (m - sched.workStart) * PX_PER_MIN;
    const isHour = m % 60 === 0;
    marks += `<div class="hour-mark ${isHour ? '' : 'half'}" style="top:${top}px">${isHour ? `<span class="hour-label mono">${toHHMM(m)}</span>` : ''}</div>`;
  }

  let nowLine = '';
  if (isToday && nowMin >= sched.workStart && nowMin <= sched.workEnd) {
    nowLine = `<div class="now-line" style="top:${(nowMin - sched.workStart) * PX_PER_MIN}px"><span class="now-line-label">いま</span></div>`;
  }

  const blocksHTML = sched.blocks.map(b => blockHTML(b, sched.workStart)).join('');

  const overflowHTML = sched.overflow.length ? `
    <div class="overflow-box">
      <b>時間内に収まらなかったタスク</b>
      ${sched.overflow.map(t => escapeHTML(t.name || '(無題タスク)')).join(' / ')}
    </div>` : '';

  const totalTasks = state.scheduleTasks.length;
  const doneTasksCount = state.scheduleTasks.filter(t => t.done).length;
  const progressHTML = totalTasks ? `
    <div class="progress-strip">
      <span class="progress-label">${doneTasksCount}/${totalTasks} 完了</span>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(doneTasksCount/totalTasks*100)}%"></div></div>
    </div>` : '';

  const celebrateHTML = (totalTasks > 0 && doneTasksCount === totalTasks && sched.overflow.length === 0) ? `
    <div class="celebrate-box">${ICON.check}今日のやることはすべて完了しました</div>` : '';

  return `
  <div class="page">
    <div class="sched-topline">
      <div>
        <h1 class="sched-date">${fmtDateLabel(state.date)}</h1>
        ${sched.meetingsCount ? `<div class="sched-sub">会議 ${sched.meetingsCount}件</div>` : ''}
      </div>
      <div class="sched-actions no-print">
        <button class="btn btn-ghost" data-action="go-input">${ICON.arrowLeft}編集に戻る</button>
        <button class="btn btn-ghost" data-action="print">${ICON.printer}印刷</button>
      </div>
    </div>
    ${progressHTML}
    <div class="sched-hint no-print">タスクやランチのブロックは、左上の<svg style="width:11px;height:11px;vertical-align:-1px" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>をドラッグすると時間帯を、下端をドラッグすると長さを調整できます。</div>
    <div class="timeline-wrap">
      <div class="timeline" id="timeline" style="height:${heightPx}px">
        ${marks}
        ${nowLine}
        ${blocksHTML}
      </div>
    </div>
    ${celebrateHTML}
    ${overflowHTML}
  </div>`;
}

function blockHTML(b, workStart) {
  const top = (b.start - workStart) * PX_PER_MIN;
  const height = Math.max(20, (b.end - b.start) * PX_PER_MIN);
  const durationMin = Math.round(b.end - b.start);
  const isSplitTask = b.type === 'task' && (b.partCount || 1) > 1;
  const totalDuration = Math.round(b.totalDuration || durationMin);
  const timeLabel = isSplitTask
    ? `${toHHMM(b.start)}–${toHHMM(b.end)}（この枠${durationMin}分・合計${totalDuration}分）`
    : `${toHHMM(b.start)}–${toHHMM(b.end)}（${durationMin}分）`;
  const sizeClass = durationMin <= 20 ? 'short-block tiny-block' : (durationMin <= 30 ? 'short-block' : '');
  if (b.type === 'lunch') {
    return `
    <div class="block block-fixed lunch ${sizeClass}" style="top:${top}px;height:${height}px" data-block-id="${b.id}" data-lunch-block>
      <span class="grip no-print" data-drag-handle-lunch>${ICON.grip}</span>
      <div class="block-inner" style="padding-top:22px">
        <div class="block-title">${escapeHTML(b.title)}</div>
        <div class="block-time mono">${timeLabel}</div>
      </div>
      <span class="block-tag">ランチ</span>
      <div class="resize-handle no-print" data-resize-handle-lunch></div>
    </div>`;
  }
  if (b.fixed) {
    return `
    <div class="block block-fixed ${sizeClass}" style="top:${top}px;height:${height}px" data-block-id="${b.id}">
      <div class="block-inner">
        <div class="block-title">${escapeHTML(b.title)}</div>
        <div class="block-time mono">${timeLabel}</div>
      </div>
      <span class="block-tag">固定</span>
    </div>`;
  }
  const priIdx = ((((b.priority ?? 1) - 1) % 5) + 5) % 5;
  const isLastPart = (b.partIndex || 1) === (b.partCount || 1);
  return `
  <div class="block block-task pri-${priIdx} ${sizeClass} ${b.done ? 'done' : ''}" style="top:${top}px;height:${height}px" data-block-id="${b.id}" data-task-id="${b.taskId}" data-part-index="${b.partIndex || 1}" data-part-count="${b.partCount || 1}">
    <span class="grip no-print" data-drag-handle>${ICON.grip}</span>
    <button class="done-toggle no-print" data-action="toggle-done" aria-label="完了">${ICON.check}</button>
    <div class="block-inner" style="padding-top:22px">
      <div class="block-title">${escapeHTML(b.title)}</div>
      <div class="block-time mono">${timeLabel}</div>
    </div>
    ${isLastPart ? '<div class="resize-handle no-print" data-resize-handle></div>' : ''}
  </div>`;
}

function positionBlocks() { /* layout done via inline styles already */ }

function escapeHTML(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHTML(s); }

/* =========================================================
   Event delegation
   ========================================================= */
const app = document.getElementById('app');

app.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'add-task') {
    state.masterTasks.push({ id: uid(), name: '', deadline: '', priority: state.masterTasks.length + 1, done: false });
    render(); scheduleSaveMaster();
  } else if (action === 'delete-task') {
    const row = e.target.closest('[data-task-id]');
    const id = row.dataset.taskId;
    state.masterTasks = state.masterTasks.filter(t => t.id !== id);
    renumberMasterTasks();
    render(); scheduleSaveMaster();
  } else if (action === 'prev-day') {
    changeDate(-1);
  } else if (action === 'next-day') {
    changeDate(1);
  } else if (action === 'run-schedule') {
    const pending = [...state.masterTasks]
      .filter(t => !t.done)
      .sort((a,b) => (a.priority ?? 999) - (b.priority ?? 999));
    state.scheduleTasks = pending.map(t => ({ id: t.id, name: t.name, priority: t.priority, manualDuration: null, done: false }));
    state.generated = true;
    state.page = 'schedule';
    render(); scheduleSaveDate();
  } else if (action === 'view-schedule') {
    state.page = 'schedule';
    render();
  } else if (action === 'go-input') {
    state.page = 'input';
    render();
  } else if (action === 'print') {
    window.print();
  } else if (action === 'toggle-done') {
    const blockEl = e.target.closest('[data-task-id]');
    const taskId = blockEl.dataset.taskId;
    const entry = state.scheduleTasks.find(x => x.id === taskId);
    if (entry) entry.done = !entry.done;
    const master = state.masterTasks.find(x => x.id === taskId);
    if (master) master.done = entry ? entry.done : !master.done;
    render(); scheduleSaveDate(); scheduleSaveMaster();
  }
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-task-field]')) {
    const row = t.closest('[data-task-id]');
    const task = state.masterTasks.find(x => x.id === row.dataset.taskId);
    if (!task) return;
    const field = t.dataset.taskField;
    task[field] = field === 'priority' ? (parseInt(t.value, 10) || 1) : t.value;
    scheduleSaveMaster();
  } else if (t.dataset.field === 'meetingsText') {
    state.meetingsText = t.value;
    scheduleSaveDate();
    const wrapper = t.parentElement;
    const existing = wrapper.querySelector('.meetings-preview');
    if (existing) existing.remove();
    wrapper.insertAdjacentHTML('beforeend', meetingsPreviewHTML());
  } else if (t.dataset.timeField) {
    state[t.dataset.timeField] = t.value;
    scheduleSaveDate();
  }
});

app.addEventListener('change', (e) => {
  if (e.target.dataset.action === 'set-date') {
    const newDate = e.target.value;
    resetDateFields(newDate);
    state.page = 'input';
    render();
    if (cloudEnabled) attachDateListener(newDate);
  }
});

function changeDate(delta) {
  const [y,m,d] = state.date.split('-').map(Number);
  const nd = new Date(y, m-1, d + delta);
  const newDate = fmtDate(nd);
  resetDateFields(newDate);
  state.page = 'input';
  render();
  if (cloudEnabled) attachDateListener(newDate);
}

/* =========================================================
   Task list drag reorder (pointer events, touch-friendly)
   ========================================================= */
app.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.task-drag-handle');
  if (!handle) return;
  startTaskListReorder(handle, e);
});

function startTaskListReorder(handle, e) {
  if (e.button != null && e.button !== 0) return;
  const row = handle.closest('.task-row');
  const table = row?.closest('.task-table');
  if (!row || !table) return;

  e.preventDefault();
  const pointerId = e.pointerId;
  const startX = e.clientX;
  const startY = e.clientY;
  const startRect = row.getBoundingClientRect();
  const previousUserSelect = document.body.style.userSelect;
  let latestX = startX;
  let latestY = startY;
  let frameId = null;
  let moved = false;
  const shiftAnimations = new WeakMap();

  const ghost = row.cloneNode(true);
  ghost.classList.remove('task-list-placeholder');
  ghost.classList.add('task-drag-ghost');
  Object.assign(ghost.style, {
    left: startRect.left + 'px',
    top: startRect.top + 'px',
    width: startRect.width + 'px',
    height: startRect.height + 'px',
    transform: 'translate3d(0,0,0)',
  });
  document.body.appendChild(ghost);
  row.classList.add('task-list-placeholder');
  document.body.style.userSelect = 'none';
  try { handle.setPointerCapture(pointerId); } catch (_) {}

  function stopShiftAnimation(taskRow) {
    const animation = shiftAnimations.get(taskRow);
    if (animation?.raf) cancelAnimationFrame(animation.raf);
    if (animation?.timer) clearTimeout(animation.timer);
    shiftAnimations.delete(taskRow);
    taskRow.style.transition = 'none';
    taskRow.style.transform = '';
  }

  function animatePlacement(target, placeBefore) {
    if ((placeBefore && row.nextSibling === target) ||
        (!placeBefore && target.nextSibling === row)) return;

    const rows = Array.from(table.querySelectorAll('.task-row'));
    const beforeTops = new Map(rows.map(taskRow => [taskRow, taskRow.getBoundingClientRect().top]));
    rows.forEach(taskRow => {
      if (taskRow !== row) stopShiftAnimation(taskRow);
    });

    table.insertBefore(row, placeBefore ? target : target.nextSibling);
    moved = true;

    rows.forEach(taskRow => {
      if (taskRow === row) return;
      const beforeTop = beforeTops.get(taskRow);
      const afterTop = taskRow.getBoundingClientRect().top;
      const delta = beforeTop - afterTop;
      if (Math.abs(delta) < .5) return;

      taskRow.style.transform = `translate3d(0,${delta}px,0)`;
      const animation = { raf:null, timer:null };
      animation.raf = requestAnimationFrame(() => {
        animation.raf = null;
        taskRow.style.transition = 'transform 180ms cubic-bezier(.2,.8,.2,1)';
        taskRow.style.transform = 'translate3d(0,0,0)';
        animation.timer = setTimeout(() => {
          if (shiftAnimations.get(taskRow) !== animation) return;
          taskRow.style.transition = '';
          taskRow.style.transform = '';
          shiftAnimations.delete(taskRow);
        }, 190);
      });
      shiftAnimations.set(taskRow, animation);
    });

    Array.from(table.querySelectorAll('.task-row')).forEach((taskRow, index) => {
      const number = taskRow.querySelector('.priority-number');
      if (number) number.textContent = String(index + 1);
    });
  }

  function updateDragFrame() {
    frameId = null;
    ghost.style.transform = `translate3d(0,${latestY - startY}px,0)`;

    const target = document.elementFromPoint(latestX, latestY)?.closest('.task-row');
    if (!target || target === row || target.parentElement !== table) return;
    const rect = target.getBoundingClientRect();
    animatePlacement(target, latestY < rect.top + rect.height / 2);
  }

  function onMove(ev) {
    if (ev.pointerId !== pointerId) return;
    ev.preventDefault();
    latestX = ev.clientX;
    latestY = ev.clientY;
    if (frameId == null) frameId = requestAnimationFrame(updateDragFrame);
  }

  function finish(ev) {
    if (ev.pointerId !== pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', finish);
    document.removeEventListener('pointercancel', finish);
    if (frameId != null) {
      cancelAnimationFrame(frameId);
      frameId = null;
      updateDragFrame();
    }
    document.body.style.userSelect = previousUserSelect;
    try { handle.releasePointerCapture(pointerId); } catch (_) {}

    if (moved) {
      const taskById = new Map(state.masterTasks.map(task => [task.id, task]));
      const orderedIds = Array.from(table.querySelectorAll('.task-row')).map(taskRow => taskRow.dataset.taskId);
      state.masterTasks = orderedIds.map(id => taskById.get(id)).filter(Boolean);
      renumberMasterTasks();
      scheduleSaveMaster();
    }

    const finalRect = row.getBoundingClientRect();
    const finalY = finalRect.top - startRect.top;
    ghost.style.transition = 'transform 160ms cubic-bezier(.2,.8,.2,1), opacity 160ms ease';
    requestAnimationFrame(() => {
      ghost.style.transform = `translate3d(0,${finalY}px,0)`;
      ghost.style.opacity = '.72';
    });
    setTimeout(() => {
      ghost.remove();
      row.classList.remove('task-list-placeholder');
    }, 170);
  }

  document.addEventListener('pointermove', onMove, { passive:false });
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
}

/* =========================================================
   Schedule drag reorder / resize (pointer events, touch-friendly)
   ========================================================= */
let dragCtx = null;

app.addEventListener('pointerdown', (e) => {
  const resizeHandle = e.target.closest('[data-resize-handle]');
  const dragHandle = e.target.closest('[data-drag-handle]');
  const lunchResize = e.target.closest('[data-resize-handle-lunch]');
  const lunchDrag = e.target.closest('[data-drag-handle-lunch]');
  if (resizeHandle) {
    const blockEl = resizeHandle.closest('.block-task');
    startResize(blockEl, e);
  } else if (dragHandle) {
    const blockEl = dragHandle.closest('.block-task');
    startReorder(blockEl, e);
  } else if (lunchResize) {
    const blockEl = lunchResize.closest('[data-lunch-block]');
    startResizeLunch(blockEl, e);
  } else if (lunchDrag) {
    const blockEl = lunchDrag.closest('[data-lunch-block]');
    startMoveLunch(blockEl, e);
  }
});

function startResizeLunch(blockEl, e) {
  e.preventDefault();
  const startY = e.clientY;
  const startHeight = blockEl.getBoundingClientRect().height;
  blockEl.classList.add('resizing');

  function onMove(ev) {
    const dy = ev.clientY - startY;
    const newHeight = Math.max(20, startHeight + dy);
    blockEl.style.height = newHeight + 'px';
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    blockEl.classList.remove('resizing');
    const newHeightPx = parseFloat(blockEl.style.height);
    const workEnd = toMin(state.workEnd);
    const lunchStartMin = toMin(state.lunchStart);
    let newDur = Math.max(5, round5(newHeightPx / PX_PER_MIN));
    if (workEnd != null && lunchStartMin != null) newDur = Math.min(newDur, workEnd - lunchStartMin);
    state.lunchEnd = toHHMM(lunchStartMin + newDur);
    render(); scheduleSaveDate();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startMoveLunch(blockEl, e) {
  e.preventDefault();
  const startY = e.clientY;
  const startTop = parseFloat(blockEl.style.top);
  const workStart = toMin(state.workStart);
  const workEnd = toMin(state.workEnd);
  const durationMin = toMin(state.lunchEnd) - toMin(state.lunchStart);
  blockEl.classList.add('dragging');

  function onMove(ev) {
    const dy = ev.clientY - startY;
    blockEl.style.top = (startTop + dy) + 'px';
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    blockEl.classList.remove('dragging');
    const newTop = parseFloat(blockEl.style.top);
    let newStart = round5(workStart + newTop / PX_PER_MIN);
    newStart = Math.max(workStart, Math.min(newStart, workEnd - durationMin));
    state.lunchStart = toHHMM(newStart);
    state.lunchEnd = toHHMM(newStart + durationMin);
    render(); scheduleSaveDate();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startResize(blockEl, e) {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  const taskId = blockEl.dataset.taskId;
  const task = state.scheduleTasks.find(t => t.id === taskId);
  const timeline = document.getElementById('timeline');
  const sched = buildSchedule();
  const taskParts = sched.blocks.filter(b => b.type === 'task' && b.taskId === taskId);
  const activePart = taskParts.find(b => b.id === blockEl.dataset.blockId);
  if (!task || !timeline || !taskParts.length || !activePart) return;

  const pointerId = e.pointerId;
  const captureEl = e.target.closest('[data-resize-handle]') || blockEl;
  const timelineRect = timeline.getBoundingClientRect();
  const taskStart = Math.min(...taskParts.map(b => b.start));
  const fixedBlocks = sched.blocks.filter(b => b.fixed);
  const originalLabel = blockEl.querySelector('.block-time')?.textContent || '';
  blockEl.classList.add('resizing');
  try { captureEl.setPointerCapture(pointerId); } catch (_) {}

  function pointerToMinute(clientY) {
    const ratio = (clientY - timelineRect.top) / Math.max(1, timelineRect.height);
    const rawMinute = sched.workStart + ratio * (sched.workEnd - sched.workStart);
    return Math.max(taskStart + 5, Math.min(sched.workEnd, round5(rawMinute)));
  }

  function availableTaskMinutes(endMinute) {
    let available = Math.max(0, endMinute - taskStart);
    for (const fixed of fixedBlocks) {
      const overlap = Math.max(0, Math.min(endMinute, fixed.end) - Math.max(taskStart, fixed.start));
      available -= overlap;
    }
    return Math.max(5, clamp5(available));
  }

  function preview(clientY) {
    const candidateEnd = pointerToMinute(clientY);
    const visualDuration = Math.max(5, candidateEnd - activePart.start);
    blockEl.style.height = Math.max(20, visualDuration * PX_PER_MIN) + 'px';
    const label = blockEl.querySelector('.block-time');
    if (label) {
      label.textContent = `${toHHMM(activePart.start)}–${toHHMM(candidateEnd)}（合計${availableTaskMinutes(candidateEnd)}分）`;
    }
    return candidateEnd;
  }

  function onMove(ev) {
    if (ev.pointerId !== pointerId) return;
    ev.preventDefault();
    preview(ev.clientY);
  }

  function finish(ev) {
    if (ev.pointerId !== pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', finish);
    document.removeEventListener('pointercancel', finish);
    blockEl.classList.remove('resizing');
    try { captureEl.releasePointerCapture(pointerId); } catch (_) {}

    if (ev.type === 'pointercancel') {
      const label = blockEl.querySelector('.block-time');
      if (label) label.textContent = originalLabel;
      render();
      return;
    }

    const candidateEnd = preview(ev.clientY);
    task.manualDuration = availableTaskMinutes(candidateEnd);
    render();
    scheduleSaveDate();
  }

  document.addEventListener('pointermove', onMove, { passive:false });
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
}

function startReorder(blockEl, e) {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  const taskId = blockEl.dataset.taskId;
  const timeline = document.getElementById('timeline');
  const allTaskBlocks = Array.from(timeline.querySelectorAll('.block-task'));
  const selectedBlocks = allTaskBlocks.filter(el => el.dataset.taskId === taskId);
  if (!selectedBlocks.length) return;

  const pointerId = e.pointerId;
  const captureEl = e.target.closest('[data-drag-handle]') || blockEl;
  const startY = e.clientY;
  const startTop = parseFloat(blockEl.style.top);
  let latestY = startY;

  selectedBlocks.forEach(el => {
    el.classList.add('dragging');
    el.style.zIndex = 20;
  });
  try { captureEl.setPointerCapture(pointerId); } catch (_) {}

  function onMove(ev) {
    if (ev.pointerId !== pointerId) return;
    ev.preventDefault();
    latestY = ev.clientY;
    const dy = latestY - startY;
    selectedBlocks.forEach(el => {
      el.style.transform = `translate3d(0,${dy}px,0)`;
    });
  }

  function finish(ev) {
    if (ev.pointerId !== pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', finish);
    document.removeEventListener('pointercancel', finish);
    try { captureEl.releasePointerCapture(pointerId); } catch (_) {}

    selectedBlocks.forEach(el => {
      el.classList.remove('dragging');
      el.style.transform = '';
      el.style.zIndex = '';
    });

    if (ev.type === 'pointercancel') {
      render();
      return;
    }

    const newTop = startTop + (latestY - startY);
    const firstTopByTask = new Map();
    allTaskBlocks.forEach(el => {
      const id = el.dataset.taskId;
      if (id === taskId) return;
      const top = parseFloat(el.style.top);
      if (!firstTopByTask.has(id) || top < firstTopByTask.get(id)) firstTopByTask.set(id, top);
    });

    const visibleOthers = Array.from(firstTopByTask, ([id, top]) => ({ id, top }))
      .sort((a,b) => a.top - b.top);
    let insertIdx = visibleOthers.findIndex(item => newTop < item.top);
    if (insertIdx === -1) insertIdx = visibleOthers.length;

    const visibleOtherIds = visibleOthers.map(item => item.id);
    const pendingEntries = state.scheduleTasks.filter(t => !t.done);
    const pendingMap = new Map(pendingEntries.map(t => [t.id, t]));
    const invisibleIds = pendingEntries
      .map(t => t.id)
      .filter(id => id !== taskId && !firstTopByTask.has(id));
    const newOrderIds = [...visibleOtherIds];
    newOrderIds.splice(insertIdx, 0, taskId);
    newOrderIds.push(...invisibleIds.filter(id => !newOrderIds.includes(id)));

    const doneEntries = state.scheduleTasks.filter(t => t.done);
    state.scheduleTasks = [
      ...newOrderIds.map(id => pendingMap.get(id)).filter(Boolean),
      ...doneEntries,
    ];
    render();
    scheduleSaveDate();
  }

  document.addEventListener('pointermove', onMove, { passive:false });
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
}

/* =========================================================
   Boot
   ========================================================= */
if (cloudEnabled) {
  attachMasterListener();
  attachDateListener(state.date);
} else {
  setSync('off');
}
render();
</script>
</body>
